name: Check parent repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Parent fixtures need neither submodule checkout nor runtime downloads.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parent check dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          npm ci
      - name: Parent regression tests
        run: python -m unittest discover -s tests -v
      - name: Parent browser smoke checks
        run: npm run test:browser
